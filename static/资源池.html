<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <title>资源池</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
  <script src="/sidebar.js" defer></script>
  <style>
    .消息.好消息 { color: #047857; }
    .容量标记行 { margin-top: 4px; font-size: 12px; color: var(--石板浅, #64748b); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .容量余量 b { color: var(--石板, #1e293b); }
    .详情卡 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0 14px; }
    .详情策略 table { margin-bottom: 14px; }
    .grid两栏 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid两栏 table { font-size: 12.5px; }
    @media (max-width: 980px) { .grid两栏 { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-page="pools" class="壳">
  <aside class="侧栏">
    <div class="牌">资源租约台</div>
    <nav id="侧栏导航"></nav>
    <div class="底"><button class="按钮 次" type="button" id="退出钮">退出</button></div>
  </aside>
  <main class="主区">
    <header class="页头"><h1>资源池</h1><p>列表看占用，详情看容量口径与设置策略；收紧容量后既有租约保留，新申领按新容量拦截。</p></header>
    <section class="卷">
      <h2>登记新池</h2>
      <div class="表单行">
        <div class="项"><label>池键</label><input id="新池键" placeholder="pool-demo"/></div>
        <div class="项"><label>名称</label><input id="新名称" placeholder="演示池"/></div>
        <div class="项"><label>容量</label><input id="新容量" type="number" value="50"/></div>
        <button class="按钮 琥珀" type="button" id="登记钮">登记</button>
      </div>
      <p class="消息" id="登记消息"></p>
    </section>
    <section class="卷">
      <div class="工具条" style="justify-content:space-between">
        <h2 style="margin:0">池列表 · 占用</h2>
        <p class="消息" id="容量消息" style="margin:0;max-width:60%"></p>
      </div>
      <table>
        <thead><tr><th>池键</th><th>名称</th><th>占用 / 余量</th><th>启用</th><th>操作</th></tr></thead>
        <tbody id="池表"></tbody>
      </table>
    </section>
    <section class="卷" id="详情卷" hidden>
      <h2>池详情 · <span id="详情标题"></span></h2>
      <div class="详情卡" id="详情卡"></div>
      <div class="详情策略" id="详情策略"></div>
      <div class="grid两栏">
        <div>
          <h3>容量切流账（改容量指纹）</h3>
          <table>
            <thead><tr><th>指纹</th><th>容量变化</th><th>收紧前已占</th><th>重算余量</th><th>动作</th><th>说明</th><th>时刻</th></tr></thead>
            <tbody id="详情切流表"></tbody>
          </table>
        </div>
        <div>
          <h3>容量裁决账（申领成败旁路）</h3>
          <table>
            <thead><tr><th>时刻</th><th>结论</th><th>原因码</th><th>租约号</th><th>读集合</th></tr></thead>
            <tbody id="详情裁决表"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script src="/js/pages/pools.js"></script>
</body>
</html>
